seed: 42

collect:
  # id ролей из справочника hh (категория «Информационные технологии»):
  # 96 программист, 165 дата-сайентист, 156 BI/аналитик данных, 164 продуктовый аналитик,
  # 160 devops, 148 системный аналитик, 150 бизнес-аналитик, 124 тестировщик,
  # 113 сисадмин, 116 инфобез, 121 техподдержка, 104 рук. группы разработки,
  # 107 рук. проектов, 73 менеджер продукта, 126 технический писатель
  roles: [96, 165, 156, 164, 160, 148, 150, 124, 113, 116, 121, 104, 107, 73, 126]
  area: 113          # Россия
  per_page: 100      # максимум, который отдаёт hh
  max_pages: 20      # 2000 вакансий на запрос — предел выдачи
  period: 0          # 0 — за всё время, иначе 1, 3 или 7 дней
  pause: 0.5         # пауза между запросами, чтобы не словить блокировку
  out: data/vacancies.parquet

data:
  path: data/vacancies.parquet
  min_text_len: 40       # вакансии короче — мусор
  min_class_count: 150   # роли, где меньше вакансий, уходят в "прочее"
  test_size: 0.2
  val_size: 0.1

model:
  name: cointegrated/rubert-tiny2
  max_len: 256
  dropout: 0.2

train:
  epochs: 4
  batch_size: 32
  lr: 3.0e-5
  head_lr: 1.0e-3        # головам нужен шаг побольше, чем энкодеру
  warmup_ratio: 0.1
  weight_decay: 0.01
  grade_weight: 1.0      # вес лосса головы грейда
  role_weight: 1.0
  class_balance: true    # веса классов в лоссе: грейды сильно несбалансированы

cluster:
  sample: 20000
  umap: {n_neighbors: 15, min_dist: 0.0, n_components: 10}
  hdbscan: {min_cluster_size: 60, min_samples: 10}

export:
  onnx_path: results/model.onnx
  bench_runs: 200

results_dir: results
